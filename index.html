<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Premium Reader | Lector Premium</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- SDK de Monetag -->
    <script src='//libtl.com/sdk.js' data-zone='11195089' data-sdk='show_11195089'></script>
    
    <!-- Fuentes de Google para el estilo dibujado a mano -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Kalam:wght@400;700&display=swap" rel="stylesheet">

    <style>
        /* === VARIABLES Y RESETEO === */
        :root {
            --bg-color: #f6eedb;
            --card-bg: #fdfbf7;
            --text-dark: #3b2b1f;
            --text-light: #6b5a4c;
            --border-color: #8c6a52;
            --btn-bg: #6a4b38;
            --btn-text: #fdfbf7;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Kalam', cursive;
            background-color: var(--bg-color);
            /* Textura de papel sutil */
            background-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="noiseFilter"><feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noiseFilter)" opacity="0.05"/></svg>');
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            color: var(--text-dark);
        }

        /* === CONTENEDOR PRINCIPAL (TARJETA) === */
        .app-card {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 400px;
            border-radius: 30px;
            padding: 30px 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            border: 2px solid #e3d5c5;
            position: relative;
            overflow: hidden;
            /* Animación de aparición */
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* === CABECERA === */
        .header {
            text-align: center;
            position: relative;
            margin-bottom: 20px;
        }

        .header h1 {
            font-family: 'Kalam', cursive;
            font-size: 2.8rem;
            line-height: 0.9;
            font-weight: 700;
            color: var(--text-dark);
            letter-spacing: 1px;
        }

        /* Corazones decorativos de la cabecera */
        .deco-heart {
            position: absolute;
            color: #d4a373;
            font-size: 1.2rem;
        }
        .h1 { top: 0; left: 10%; transform: rotate(-15deg); }
        .h2 { top: 5px; right: 15%; transform: rotate(15deg); font-size: 0.8rem; }
        .h3 { bottom: -5px; left: 30%; transform: rotate(10deg); font-size: 1rem; }
        .h4 { bottom: 0; right: 25%; transform: rotate(-10deg); font-size: 1.5rem; }

        /* === SELECTOR DE IDIOMA === */
        .lang-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 5px;
        }

        .lang-btn {
            background: transparent;
            border: 2px solid var(--border-color);
            border-radius: 20px;
            padding: 5px 15px;
            font-family: 'Kalam', cursive;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s;
            /* Borde irregular dibujado a mano */
            border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
        }

        .lang-btn.active {
            background-color: #ebd9c8;
            border-color: var(--text-dark);
        }

        .lang-divider {
            color: var(--border-color);
            font-size: 1.2rem;
        }

        .lang-label {
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-light);
            margin-bottom: 20px;
            font-weight: 700;
        }

        /* === ÁREA DE CARGA (UPLOAD) === */
        .upload-area {
            border: 2px dashed var(--border-color);
            border-radius: 20px;
            padding: 30px 15px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 20px;
            position: relative;
            background-color: #faf7f2;
            transition: background 0.2s;
            /* Borde irregular */
            border-radius: 15px 255px 15px 225px/225px 15px 255px 15px;
        }

        .upload-area:active {
            background-color: #f0e8db;
        }

        /* Corazones dentro del área de carga */
        .upload-area::before, .upload-area::after {
            content: '♡';
            position: absolute;
            color: var(--border-color);
            font-size: 1rem;
        }
        .upload-area::before { top: 10px; left: 15px; transform: rotate(-20deg); }
        .upload-area::after { top: 10px; right: 15px; transform: rotate(20deg); }

        .upload-icon {
            margin-bottom: 10px;
        }

        .upload-icon svg {
            width: 60px;
            height: 60px;
            stroke: var(--text-dark);
            stroke-width: 1.5;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .upload-text-main {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 5px;
        }

        .upload-text-sub {
            font-size: 0.9rem;
            color: var(--text-light);
            margin-bottom: 15px;
        }

        .upload-formats {
            font-size: 0.8rem;
            color: var(--text-light);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .file-input {
            display: none;
        }

        /* === PREVISUALIZACIÓN DE IMAGEN === */
        .preview-container {
            display: none;
            justify-content: center;
            margin-bottom: 20px;
        }

        .preview-img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 10px;
            border: 2px solid var(--border-color);
            box-shadow: 3px 3px 0 rgba(140, 106, 82, 0.2);
        }

        /* === CARGADOR === */
        .loader-container {
            display: none;
            flex-direction: column;
            align-items: center;
            margin: 20px 0;
        }

        .spinner {
            width: 30px;
            height: 30px;
            border: 3px solid #e3d5c5;
            border-top: 3px solid var(--border-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 10px;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        .status-text {
            font-size: 1rem;
            color: var(--text-light);
            font-weight: 700;
            text-align: center;
        }

        /* === CAJA DE RESULTADOS === */
        .result-section {
            display: none;
            margin-bottom: 20px;
        }

        .result-box {
            background: #faf7f2;
            border: 2px solid var(--border-color);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .result-label {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-light);
            margin-bottom: 8px;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 5px;
        }

        .result-text {
            font-family: 'Kalam', cursive;
            font-size: 1rem;
            color: var(--text-dark);
            max-height: 150px;
            overflow-y: auto;
            white-space: pre-wrap;
        }

        /* === BOTÓN DE ACCIÓN === */
        .action-btn {
            width: 100%;
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            padding: 15px;
            font-size: 1.3rem;
            font-family: 'Kalam', cursive;
            font-weight: 700;
            border-radius: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            transition: transform 0.1s;
            box-shadow: 0 4px 0 #4a3122;
            margin-bottom: 20px;
            /* Borde irregular ligeramente */
            border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
        }

        .action-btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        .action-btn.copied {
            background-color: #7b9c75;
            box-shadow: 0 4px 0 #53704e;
        }

        /* === PIE DE PÁGINA === */
        .footer {
            text-align: center;
            font-size: 1rem;
            color: var(--text-light);
            line-height: 1.4;
            position: relative;
            padding-bottom: 20px;
        }

        .footer-hearts {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
            font-size: 1rem;
            color: var(--border-color);
        }

        /* === TOAST (NOTIFICACIÓN) === */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--text-dark);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 1rem;
            font-weight: 700;
            opacity: 0;
            transition: all 0.3s ease;
            pointer-events: none;
            z-index: 1000;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* Ocultar elementos por defecto */
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="app-card">
        <!-- CABECERA -->
        <div class="header">
            <span class="deco-heart h1">♡</span>
            <span class="deco-heart h2">♡</span>
            <span class="deco-heart h3">♡</span>
            <span class="deco-heart h4">♡</span>
            <h1 id="header-title">PREMIUM<br>READER</h1>
        </div>

        <!-- SELECTOR DE IDIOMA -->
        <div class="lang-container">
            <button class="lang-btn active" id="btn-es" onclick="changeLanguage('es')">
                🇪🇸 ES
            </button>
            <span class="lang-divider">♡</span>
            <button class="lang-btn" id="btn-en" onclick="changeLanguage('en')">
                🇬🇧 EN
            </button>
        </div>
        <div class="lang-label" id="lang-label">- Idioma / Language -</div>

        <!-- ÁREA DE SUBIDA -->
        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">
                <svg viewBox="0 0 24 24">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <circle cx="8.5" cy="8.5" r="1.5"></circle>
                    <polyline points="21 15 16 10 5 21"></polyline>
                </svg>
            </div>
            <div class="upload-text-main" id="upload-main">Arrastra una imagen aquí</div>
            <div class="upload-text-sub" id="upload-sub">o toca para seleccionar desde tu galería</div>
            <div class="upload-formats">
                <span>♡</span> <span id="upload-formats-text">formatos JPG, PNG • hasta 10MB</span> <span>♡</span>
            </div>
            <input type="file" id="fileInput" class="file-input" accept="image/jpeg, image/png, image/jpg, image/webp">
        </div>

        <!-- PREVISUALIZACIÓN -->
        <div id="previewContainer" class="preview-container"></div>

        <!-- CARGADOR -->
        <div id="loader" class="loader-container">
            <div class="spinner"></div>
            <div class="status-text" id="statusMessage">Procesando...</div>
        </div>

        <!-- RESULTADOS Y BOTÓN DE COPIAR -->
        <div id="resultSection" class="result-section">
            <div class="result-box">
                <div class="result-label" id="result-label">Texto extraído:</div>
                <div class="result-text" id="extractedText"></div>
            </div>
        </div>

        <button class="action-btn" id="copyButton">
            <span>♡</span> <span id="copy-btn-text">Copiar texto</span>
        </button>

        <!-- PIE DE PÁGINA -->
        <div class="footer">
            <div id="footer-text">El texto se extraerá con cuidado<br>y se guardará en tu biblioteca ✨</div>
            <div class="footer-hearts">
                <span>♡</span><span>♡</span><span>♡</span><span>♥</span><span>♡</span><span>♡</span><span>♡</span>
            </div>
        </div>
    </div>

    <div id="toastMsg" class="toast">¡Copiado!</div>

    <script>
        // ====== SISTEMA DE MONETAG ======
        let conversionCount = parseInt(localStorage.getItem('ocrConversionCount') || '0');
        let nextAdThreshold = parseInt(localStorage.getItem('ocrNextAdThreshold') || '0');

        function resetAdThreshold() {
            nextAdThreshold = Math.floor(Math.random() * 4) + 4; 
            localStorage.setItem('ocrNextAdThreshold', nextAdThreshold.toString());
        }

        if (nextAdThreshold === 0) resetAdThreshold();

        function showRewardedPopup() {
            try {
                if (typeof show_11195089 === 'function') {
                    show_11195089('pop').catch(() => {});
                }
            } catch (error) {}
        }

        async function checkAndShowAd() {
            if (conversionCount >= nextAdThreshold) {
                await new Promise(resolve => setTimeout(resolve, 1500));
                showRewardedPopup(); 
                conversionCount = 0;
                localStorage.setItem('ocrConversionCount', '0');
                resetAdThreshold();
            }
        }

        // ====== SISTEMA DE IDIOMAS (i18n) ======
        const translations = {
            es: {
                header: "PREMIUM<br>READER",
                langLabel: "- Idioma / Language -",
                uploadMain: "Arrastra una imagen aquí",
                uploadSub: "o toca para seleccionar desde tu galería",
                uploadFormats: "formatos JPG, PNG • hasta 10MB",
                processing: "Procesando imagen...",
                uploading: "Subiendo...",
                scanning: "Escaneando...",
                complete: "¡Completado!",
                error: "Error de procesamiento. Intenta de nuevo.",
                noText: "No se detectó texto en la imagen.",
                resultLabel: "Texto extraído:",
                copyBtn: "Copiar texto",
                copied: "¡Copiado!",
                copySuccess: "¡Texto copiado!",
                empty: "No hay texto para copiar",
                footer: "El texto se extraerá con cuidado<br>y se guardará en tu biblioteca ✨"
            },
            en: {
                header: "PREMIUM<br>READER",
                langLabel: "- Language / Idioma -",
                uploadMain: "Drag an image here",
                uploadSub: "or tap to select from your gallery",
                uploadFormats: "JPG, PNG formats • up to 10MB",
                processing: "Processing image...",
                uploading: "Uploading...",
                scanning: "Scanning...",
                complete: "Complete!",
                error: "Processing error. Please try again.",
                noText: "No text detected in the image.",
                resultLabel: "Extracted text:",
                copyBtn: "Copy text",
                copied: "Copied!",
                copySuccess: "Text copied!",
                empty: "No text to copy",
                footer: "Text will be carefully extracted<br>and saved to your library ✨"
            }
        };

        let currentLang = 'es';

        function changeLanguage(lang) {
            currentLang = lang;
            
            // Actualizar botones activos
            document.getElementById('btn-es').classList.toggle('active', lang === 'es');
            document.getElementById('btn-en').classList.toggle('active', lang === 'en');
            
            // Actualizar textos
            const t = translations[lang];
            document.getElementById('header-title').innerHTML = t.header;
            document.getElementById('lang-label').textContent = t.langLabel;
            document.getElementById('upload-main').textContent = t.uploadMain;
            document.getElementById('upload-sub').textContent = t.uploadSub;
            document.getElementById('upload-formats-text').textContent = t.uploadFormats;
            document.getElementById('result-label').textContent = t.resultLabel;
            document.getElementById('copy-btn-text').textContent = t.copyBtn;
            document.getElementById('footer-text').innerHTML = t.footer;
            
            // Si hay un mensaje de estado visible, traducirlo
            const statusMsg = document.getElementById('statusMessage');
            if (!statusMsg.parentElement.classList.contains('hidden')) {
                if (statusMsg.textContent.includes('Subiendo') || statusMsg.textContent.includes('Uploading')) {
                    statusMsg.textContent = t.uploading;
                } else if (statusMsg.textContent.includes('Escaneando') || statusMsg.textContent.includes('Scanning')) {
                    statusMsg.textContent = t.scanning;
                } else if (statusMsg.textContent.includes('Completado') || statusMsg.textContent.includes('Complete')) {
                    statusMsg.textContent = t.complete;
                }
            }
        }

        // ====== FUNCIONALIDAD OCR ======
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const previewContainer = document.getElementById('previewContainer');
        const loaderDiv = document.getElementById('loader');
        const resultSection = document.getElementById('resultSection');
        const extractedTextSpan = document.getElementById('extractedText');
        const copyBtn = document.getElementById('copyButton');
        const toast = document.getElementById('toastMsg');
        const statusMessage = document.getElementById('statusMessage');

        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        async function copyTextToClipboard(text) {
            if (!text || text.trim() === '' || text.includes(translations[currentLang].noText)) {
                showToast(translations[currentLang].empty);
                return;
            }
            try {
                await navigator.clipboard.writeText(text);
                copyBtn.classList.add('copied');
                document.getElementById('copy-btn-text').textContent = translations[currentLang].copied;
                showToast(translations[currentLang].copySuccess);
                
                setTimeout(() => {
                    copyBtn.classList.remove('copied');
                    document.getElementById('copy-btn-text').textContent = translations[currentLang].copyBtn;
                }, 2000);
            } catch (err) {
                // Fallback para navegadores antiguos
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showToast(translations[currentLang].copySuccess);
            }
        }

        function imageToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        async function extractTextWithOCRspace(base64Image) {
            // NOTA: Se usa la API existente, puedes cambiarla por la tuya si lo deseas
            const apiKey = 'K87489118088957'; 
            const formData = new FormData();
            formData.append('base64Image', `data:image/jpeg;base64,${base64Image}`);
            formData.append('language', 'spa');
            formData.append('isOverlayRequired', 'false');
            formData.append('detectOrientation', 'true');
            formData.append('scale', 'true');
            formData.append('OCREngine', '2');
            
            const response = await fetch('https://api.ocr.space/parse/image', {
                method: 'POST',
                headers: { 'apikey': apiKey },
                body: formData
            });
            
            const data = await response.json();
            if (data.IsErroredOnProcessing) throw new Error(data.ErrorMessage || 'OCR ERROR');
            
            if (data.ParsedResults && data.ParsedResults.length > 0) {
                const text = data.ParsedResults[0].ParsedText;
                return text.trim() || translations[currentLang].noText;
            }
            return translations[currentLang].noText;
        }

        uploadArea.addEventListener('click', () => {
            fileInput.click();
        });

        fileInput.addEventListener('change', async (event) => {
            const file = event.target.files[0];
            if (!file) return;
            
            if (!file.type.startsWith('image/')) {
                showToast("Por favor, selecciona una imagen válida.");
                return;
            }
            
            // Mostrar previsualización
            const reader = new FileReader();
            reader.onload = function(e) {
                const imgPreview = document.createElement('img');
                imgPreview.src = e.target.result;
                imgPreview.classList.add('preview-img');
                previewContainer.innerHTML = '';
                previewContainer.appendChild(imgPreview);
                previewContainer.style.display = 'flex';
            };
            reader.readAsDataURL(file);
            
            // Preparar UI para cargar
            resultSection.style.display = 'none';
            loaderDiv.style.display = 'flex';
            statusMessage.textContent = translations[currentLang].uploading;
            
            try {
                statusMessage.textContent = translations[currentLang].scanning;
                const base64 = await imageToBase64(file);
                const text = await extractTextWithOCRspace(base64);
                
                extractedTextSpan.innerText = text;
                resultSection.style.display = 'block';
                
                if (text === translations[currentLang].noText) {
                    statusMessage.textContent = translations[currentLang].noText;
                } else {
                    statusMessage.textContent = translations[currentLang].complete;
                    
                    // Monetización
                    conversionCount++;
                    localStorage.setItem('ocrConversionCount', conversionCount.toString());
                    await checkAndShowAd();
                }
            } catch (error) {
                extractedTextSpan.innerText = translations[currentLang].error;
                resultSection.style.display = 'block';
                statusMessage.textContent = translations[currentLang].error;
            } finally {
                setTimeout(() => { loaderDiv.style.display = 'none'; }, 800);
            }
        });

        copyBtn.addEventListener('click', () => {
            const text = extractedTextSpan.innerText;
            if (resultSection.style.display !== 'none' && text) {
                copyTextToClipboard(text);
            } else {
                showToast(translations[currentLang].empty);
            }
        });

        // Inicializar Telegram Web App si está disponible
        if (window.Telegram && Telegram.WebApp) {
            Telegram.WebApp.expand();
            Telegram.WebApp.ready();
        }
        
        // Inicializar idioma por defecto
        changeLanguage('es');
    </script>
</body>
</html>
