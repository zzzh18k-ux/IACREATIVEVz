<!DOCTYPE html>
<html lang="en-es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>PREMIUM OCR | LECTOR PREMIUM</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- SDK de Monetag -->
    <script src='//libtl.com/sdk.js' data-zone='11195089' data-sdk='show_11195089'></script>
    
    <style>
        /* Tipografía y Reseteo */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Fuente del sistema, forzando un estilo muy limpio */
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif;
            /* Fondo cremoso y lujoso */
            background: linear-gradient(135deg, #FDFBF7 0%, #EFE8DC 100%);
            min-height: 100vh;
            padding: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #2C241B;
            /* Forzar Negrita globalmente según petición */
            font-weight: 700; 
        }

        /* Contenedor Principal (Tarjeta) con Bordes Elegantes */
        .card {
            max-width: 580px;
            width: 100%;
            background: #FFFFFF;
            border-radius: 24px;
            box-shadow: 0 24px 50px rgba(44, 36, 27, 0.08);
            padding: 40px 32px;
            /* Borde premium */
            border: 4px solid #E6D5B8;
            position: relative;
        }

        /* Línea decorativa interior */
        .card::before {
            content: '';
            position: absolute;
            top: 12px; left: 12px; right: 12px; bottom: 12px;
            border: 1px solid rgba(230, 213, 184, 0.5);
            border-radius: 14px;
            pointer-events: none;
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
            position: relative;
            z-index: 1;
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 900;
            color: #1A1510;
            letter-spacing: -0.5px;
            text-transform: uppercase;
        }

        .header p {
            color: #8C7A6B;
            margin-top: 6px;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Área de subida de imagen */
        .upload-area {
            background: #FAFAF8;
            /* Borde destacado */
            border: 3px dashed #D4C4A8;
            border-radius: 16px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 24px;
            position: relative;
            z-index: 1;
        }

        .upload-area:hover {
            background: #F4EFE6;
            border-color: #B89B5E;
        }

        .upload-icon {
            margin-bottom: 16px;
            display: flex;
            justify-content: center;
        }

        .upload-icon svg {
            width: 48px;
            height: 48px;
            stroke: #B89B5E;
        }

        .upload-text {
            font-size: 1.1rem;
            color: #4A3F35;
            font-weight: 800;
        }

        .upload-subtext {
            font-size: 0.8rem;
            color: #8C7A6B;
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .file-input {
            display: none;
        }

        /* Contenedor de la previsualización */
        .preview-container {
            display: flex;
            justify-content: center;
            margin-bottom: 24px;
            position: relative;
            z-index: 1;
        }

        .preview-img {
            max-width: 100%;
            max-height: 220px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            /* Borde premium para la imagen */
            border: 4px solid #E6D5B8;
        }

        /* Cargador elegante */
        .loader {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            margin: 30px 0;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #EFE8DC;
            border-top: 4px solid #B89B5E;
            border-radius: 50%;
            animation: spin 1s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .status-text {
            color: #8C7A6B;
            font-weight: 800;
            text-align: center;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Caja de resultados */
        .result-box {
            background: #FAFAF8;
            border-radius: 16px;
            padding: 24px;
            margin: 20px 0;
            /* Borde elegante */
            border: 2px solid #E6D5B8;
            position: relative;
            z-index: 1;
        }

        .result-label {
            font-weight: 900;
            color: #4A3F35;
            margin-bottom: 12px;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 2px solid #EFE8DC;
            padding-bottom: 8px;
        }

        .result-text {
            font-size: 1.05rem;
            line-height: 1.6;
            color: #1A1510;
            max-height: 250px;
            overflow-y: auto;
            white-space: pre-wrap;
            /* Tipografía monoespaciada pero en negrita */
            font-family: 'Courier New', Courier, monospace;
            font-weight: 700;
        }

        /* Botón de copiar */
        .copy-btn {
            background: #2C241B;
            border: 2px solid #2C241B;
            width: 100%;
            padding: 16px 0;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 800;
            color: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            z-index: 1;
        }

        .copy-btn svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: #FFFFFF;
            stroke-width: 2.5;
        }

        .copy-btn:hover {
            background: #FFFFFF;
            color: #2C241B;
        }

        .copy-btn:hover svg {
            stroke: #2C241B;
        }

        .copy-btn:active {
            transform: scale(0.98);
        }

        .copy-btn.copied {
            background: #B89B5E;
            border-color: #B89B5E;
            color: #FFFFFF;
        }
        
        .copy-btn.copied svg {
            stroke: #FFFFFF;
        }

        /* Pie de página */
        footer {
            text-align: center;
            font-size: 0.75rem;
            color: #A39182;
            margin-top: 32px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            position: relative;
            z-index: 1;
        }

        /* Notificación emergente (Toast) */
        .toast {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: #1A1510;
            color: #FFFFFF;
            padding: 12px 28px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            z-index: 999;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            border: 1px solid #4A3F35;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <h1>PREMIUM READER<br>LECTOR PREMIUM</h1>
            <p>INSTANT TEXT EXTRACTION | EXTRACCIÓN DE TEXTO INSTANTÁNEA</p>
        </div>

        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">
                <!-- Icono SVG en lugar de Emoji -->
                <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <circle cx="8.5" cy="8.5" r="1.5"></circle>
                    <polyline points="21 15 16 10 5 21"></polyline>
                </svg>
            </div>
            <div class="upload-text">TAP TO SELECT IMAGE</div>
            <div class="upload-text">TOCA PARA ELEGIR IMAGEN</div>
            <div class="upload-subtext">JPEG, PNG, WEBP</div>
            <input type="file" id="fileInput" class="file-input" accept="image/jpeg, image/png, image/jpg, image/webp">
        </div>

        <div id="previewContainer" class="preview-container" style="display: none;"></div>
        
        <div id="loader" style="display: none;" class="loader">
            <div class="spinner"></div>
            <div class="status-text" id="statusMessage">PROCESSING... | PROCESANDO...</div>
        </div>

        <div id="resultSection" style="display: none;">
            <div class="result-box">
                <div class="result-label">EXTRACTED TEXT | TEXTO EXTRAÍDO:</div>
                <div class="result-text" id="extractedText"></div>
            </div>
            <button class="copy-btn" id="copyButton">
                <!-- Icono SVG en lugar de Emoji -->
                <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                </svg>
                COPY TEXT | COPIAR TEXTO
            </button>
        </div>
        
        <footer>CLOUD PROCESSING | PROCESAMIENTO EN LA NUBE</footer>
    </div>
    
    <div id="toastMsg" class="toast">COPIED | COPIADO</div>

    <script>
        // ====== SISTEMA DE MONETAG ======
        
        let conversionCount = parseInt(localStorage.getItem('ocrConversionCount') || '0');
        let nextAdThreshold = parseInt(localStorage.getItem('ocrNextAdThreshold') || '0');

        function resetAdThreshold() {
            nextAdThreshold = Math.floor(Math.random() * 4) + 4; 
            localStorage.setItem('ocrNextAdThreshold', nextAdThreshold.toString());
        }

        if (nextAdThreshold === 0) {
            resetAdThreshold();
        }

        function showRewardedPopup() {
            try {
                if (typeof show_11195089 === 'function') {
                    show_11195089('pop').catch(() => {});
                }
            } catch (error) {}
        }

        async function checkAndShowAd() {
            if (conversionCount >= nextAdThreshold) {
                await new Promise(resolve => setTimeout(resolve, 1500));
                showRewardedPopup(); 
                conversionCount = 0;
                localStorage.setItem('ocrConversionCount', '0');
                resetAdThreshold();
            }
        }

        // ====== FUNCIONALIDAD OCR ======
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const previewContainer = document.getElementById('previewContainer');
        const loaderDiv = document.getElementById('loader');
        const resultSection = document.getElementById('resultSection');
        const extractedTextSpan = document.getElementById('extractedText');
        const copyBtn = document.getElementById('copyButton');
        const toast = document.getElementById('toastMsg');
        const statusMessage = document.getElementById('statusMessage');

        const svgCopy = `<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>`;
        const svgCheck = `<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`;

        function showToast(msg) {
            toast.textContent = msg;
            toast.style.opacity = '1';
            setTimeout(() => {
                toast.style.opacity = '0';
            }, 2000);
        }

        async function copyTextToClipboard(text) {
            if (!text || text.trim() === '') {
                showToast('EMPTY | VACÍO');
                return;
            }
            try {
                await navigator.clipboard.writeText(text);
                copyBtn.classList.add('copied');
                copyBtn.innerHTML = svgCheck + ' SUCCESS | ÉXITO';
                showToast('COPIED | COPIADO');
                setTimeout(() => {
                    copyBtn.classList.remove('copied');
                    copyBtn.innerHTML = svgCopy + ' COPY TEXT | COPIAR TEXTO';
                }, 2000);
            } catch (err) {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showToast('COPIED | COPIADO');
            }
        }

        function imageToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        async function extractTextWithOCRspace(base64Image) {
            const apiKey = 'K87489118088957';
            const formData = new FormData();
            formData.append('base64Image', `data:image/jpeg;base64,${base64Image}`);
            formData.append('language', 'spa');
            formData.append('isOverlayRequired', 'false');
            formData.append('detectOrientation', 'true');
            formData.append('scale', 'true');
            formData.append('OCREngine', '2');
            
            const response = await fetch('https://api.ocr.space/parse/image', {
                method: 'POST',
                headers: { 'apikey': apiKey },
                body: formData
            });
            
            const data = await response.json();
            if (data.IsErroredOnProcessing) throw new Error(data.ErrorMessage || 'OCR ERROR');
            
            if (data.ParsedResults && data.ParsedResults.length > 0) {
                const text = data.ParsedResults[0].ParsedText;
                return text.trim() || 'NO TEXT DETECTED | NO SE DETECTÓ TEXTO';
            }
            return 'UNREADABLE | ILEGIBLE';
        }

        uploadArea.addEventListener('click', () => {
            fileInput.click();
        });

        fileInput.addEventListener('change', async (event) => {
            const file = event.target.files[0];
            if (!file) return;
            
            if (!file.type.startsWith('image/')) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                const imgPreview = document.createElement('img');
                imgPreview.src = e.target.result;
                imgPreview.classList.add('preview-img');
                previewContainer.innerHTML = '';
                previewContainer.appendChild(imgPreview);
                previewContainer.style.display = 'flex';
            };
            reader.readAsDataURL(file);
            
            resultSection.style.display = 'none';
            loaderDiv.style.display = 'flex';
            statusMessage.textContent = 'UPLOADING... | SUBIENDO...';
            
            try {
                statusMessage.textContent = 'SCANNING... | ESCANEANDO...';
                const base64 = await imageToBase64(file);
                const text = await extractTextWithOCRspace(base64);
                
                extractedTextSpan.innerText = text;
                resultSection.style.display = 'block';
                
                if (text.includes('NO TEXT DETECTED') || text.includes('UNREADABLE')) {
                    statusMessage.textContent = 'NOT FOUND | NO ENCONTRADO';
                } else {
                    statusMessage.textContent = 'COMPLETE | COMPLETADO';
                    
                    conversionCount++;
                    localStorage.setItem('ocrConversionCount', conversionCount.toString());
                    await checkAndShowAd();
                }
            } catch (error) {
                extractedTextSpan.innerText = 'PROCESSING ERROR. TRY AGAIN. | ERROR DE PROCESAMIENTO. INTENTA DE NUEVO.';
                resultSection.style.display = 'block';
                statusMessage.textContent = 'ERROR | ERROR';
            } finally {
                setTimeout(() => { loaderDiv.style.display = 'none'; }, 600);
            }
        });

        copyBtn.addEventListener('click', () => {
            const text = extractedTextSpan.innerText;
            if (text && !text.includes('ERROR') && !text.includes('NO TEXT DETECTED') && !text.includes('UNREADABLE')) {
                copyTextToClipboard(text);
            } else {
                showToast('EMPTY | VACÍO');
            }
        });

        if (window.Telegram && Telegram.WebApp) {
            Telegram.WebApp.expand();
            Telegram.WebApp.ready();
        }
    </script>
</body>
</html>
